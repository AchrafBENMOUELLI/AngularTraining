  <div *ngIf="e.title===searchValue || searchValue==null || searchValue===''">
  <div class="card h-100 shadow-sm" ngHover>
    <img
      [src]="e.imageUrl"
      class="card-img-top img-fluid"
      style="height: 200px; object-fit: cover;"
      alt="{{e.title}}">

    <div class="card-body">
      <h5 class="card-title"
          [ngStyle]="{'color': e.nbPlaces == 0 ? 'red' : 'green'}">
        {{ e.title }}
      </h5>

      <p class="text-muted mb-1">
        <strong>Prix:</strong> {{ e.price }} DT
      </p>

      <p class="mb-1">
        <strong>📍 Lieu:</strong> {{ e.location }}
      </p>

      <p class="fw-bold mb-1">
        <strong>Places disponibles:</strong>
        <span [class.text-danger]="e.nbPlaces === 0">{{ e.nbPlaces }}</span>
      </p>

      <p class="text-secondary mb-3">{{ e.description }}</p>

      <!-- Boutons Like / Unlike -->
      <div class="d-flex gap-2 mb-2">
        <button
          [ngClass]="{
            'btn': true,
            'btn-sm': true,
            'btn-danger': e.nbrLike >= 5,
            'btn-warning': e.nbrLike < 5
          }"
          (click)="nbrLike(e)">
          👍 Like ({{ e.nbrLike }})
        </button>

        <button
          class="btn btn-sm btn-outline-secondary"
          (click)="nbrUnlike(e)"
          [disabled]="e.nbrLike === 0">
          👎 Unlike
        </button>
      </div>

      <!-- Bouton Acheter ticket -->
      <button
        class="btn btn-sm btn-primary"
        [disabled]="e.nbPlaces === 0"
        (click)="nbrPlaceDecr(e)">
        🎫 {{ e.nbPlaces === 0 ? 'Complet' : 'Acheter ticket' }}
      </button>

      <!-- Date -->
      <p class="mt-2 text-muted small">
        📅 {{ e.date | date:'dd/MM/yyyy à HH:mm' }}
      </p>

      <!-- Lien vers détails -->
      <a [routerLink]="['./details', e._id]" class="btn btn-sm btn-outline-info">
        Plus de détails →
      </a>
    </div>
  </div>
</div>
